name: Update Not Following Back

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Not Following Back section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import os
          import requests

          username = "yashKappa"
          token = os.environ["GITHUB_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          def get_users(endpoint):
              users = []
              page = 1

              while True:
                  url = f"https://api.github.com/users/{username}/{endpoint}"

                  response = requests.get(
                      url,
                      headers=headers,
                      params={
                          "per_page": 100,
                          "page": page
                      }
                  )

                  response.raise_for_status()

                  data = response.json()

                  if not data:
                      break

                  users.extend(data)
                  page += 1

              return users

          # Get Following and Followers
          following = get_users("following")
          followers = get_users("followers")

          # Convert usernames into sets
          following_names = {
              user["login"] for user in following
          }

          follower_names = {
              user["login"] for user in followers
          }

          # Find people you follow who don't follow you
          not_following_back_names = sorted(
              following_names - follower_names,
              key=str.lower
          )

          # Create lookup for full GitHub user information
          following_lookup = {
              user["login"]: user
              for user in following
          }

          rows = []

          for login in not_following_back_names:

              user = following_lookup[login]

              avatar = user.get("avatar_url", "")

              rows.append(
                  f'<td align="center">'
                  f'<a href="https://github.com/{login}">'
                  f'<img src="{avatar}" width="80" height="80" '
                  f'style="border-radius:50%;"><br>@{login}</a>'
                  f'</td>'
              )

          # Build README section
          html = [
              "<!-- NOT_FOLLOWING_BACK_SECTION:start -->",
              "",
              "## 👀 People I Follow Who Don't Follow Me Back",
              ""
          ]

          if not_following_back_names:

              count = len(not_following_back_names)

              html.append(
                  f"**{count} people**"
              )

              html.append("")

              html.append("<table>")

              for i in range(0, len(rows), 6):

                  current_row = rows[i:i + 6]

                  html.append("<tr>")

                  html.extend(current_row)

                  # Fill empty cells
                  remaining = 6 - len(current_row)

                  for _ in range(remaining):
                      html.append("<td></td>")

                  html.append("</tr>")

              html.append("</table>")

          else:

              html.append(
                  "🎉 Everyone you follow follows you back!"
              )

          html.extend([
              "",
              "<!-- NOT_FOLLOWING_BACK_SECTION:end -->"
          ])

          new_section = "\n".join(html)

          # Update README
          readme_path = "README.md"

          with open(
              readme_path,
              "r",
              encoding="utf-8"
          ) as f:
              readme = f.read()

          start_marker = (
              "<!-- NOT_FOLLOWING_BACK_SECTION:start -->"
          )

          end_marker = (
              "<!-- NOT_FOLLOWING_BACK_SECTION:end -->"
          )

          start_index = readme.find(start_marker)
          end_index = readme.find(end_marker)

          if start_index == -1 or end_index == -1:

              raise Exception(
                  "README markers were not found."
              )

          end_index += len(end_marker)

          updated_readme = (
              readme[:start_index]
              + new_section
              + readme[end_index:]
          )

          with open(
              readme_path,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(updated_readme)

          print(
              f"Following: {len(following_names)}"
          )

          print(
              f"Followers: {len(follower_names)}"
          )

          print(
              f"Not following back: "
              f"{len(not_following_back_names)}"
          )
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update people not following back"
            git push
          fi
